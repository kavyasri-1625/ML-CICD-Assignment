name: ML CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train ML model and calculate accuracy
        id: train
        run: |
          python model.py | tee model_output.txt
          ACCURACY=$(awk '/Accuracy:/{print $2}' model_output.txt)
          echo "accuracy=$ACCURACY" >> "$GITHUB_OUTPUT"

      - name: Run automated tests
        run: pytest -v

      - name: Prepare website with actual accuracy
        env:
          MODEL_ACCURACY: ${{ steps.train.outputs.accuracy }}
        run: |
          mkdir -p _site
          python - <<'PY'
          import os
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          accuracy = os.environ["MODEL_ACCURACY"]
          Path("_site/index.html").write_text(
              html.replace("{{ACCURACY}}", accuracy), encoding="utf-8"
          )
          PY

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  cd:
    name: Continuous Deployment
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
